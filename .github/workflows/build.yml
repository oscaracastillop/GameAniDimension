name: Build Android App
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-24.04
    env:
      DEPLOY_BRANCH: android
      OS_NAME: linux
      LIBWINDBOT_URL: https://github.com/ProjectIgnis/windbot/releases/download/20250412/libWindbot.aar
      LIBWINDBOT_RESOURCES: https://github.com/ProjectIgnis/windbot/releases/download/20250412/WindBotIgnite-Resources.7z
      USE_BUNDLED_FONT: 1
      PICS_URL: https://images.ygoprodeck.com/images/cards/{}.jpg
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Install apt deps
      run: |
        sudo apt update
        sudo apt install -y lua5.3 p7zip-full
        sudo ln -sf /usr/bin/lua5.3 /usr/bin/lua
    - name: Download libwindbot
      run: |
        mkdir -p libs
        curl --retry 5 --connect-timeout 30 --location -o libs/libWindbot.aar $LIBWINDBOT_URL
    - name: Set local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "org.gradle.jvmargs=-Xmx8192M" >> gradle.properties
    - name: Prepare assets
      run: |
        chmod +x ci/*.sh
        ./ci/prepare-full-assets.sh
    - name: Build client
      run: ./ci/build-android.sh
    - name: Finalize assets
      run: ./ci/finalize-assets.sh
    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
        mkdir -p release
        cp build/outputs/apk/debug/*.apk release/AniDimension-Android-ModoAventura.apk
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AniDimension-Android-ModoAventura
        path: release/AniDimension-Android-ModoAventura.apk
