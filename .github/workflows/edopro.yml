name: Build EDOPro PC Windows
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
env:
  DEPENDENCIES_BASE_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/download/20260914
  DEPLOY_DIR: deploy
  PICS_URL: https://images.ygoprodeck.com/images/cards/{}.jpg
  FIELDS_URL: https://images.ygoprodeck.com/images/cards_cropped/{}.jpg
jobs:
  Windows:
    runs-on: windows-2022
    env:
      DEPLOY_BRANCH: travis-windows-2022
      TRAVIS_OS_NAME: windows
      DXSDK_DIR: /c/d3d9sdk/
      VCPKG_ROOT: /c/vcpkg2
      VS_GEN: vs2022
      BUILD_CONFIG: release
      ARCH: x86
    steps:
    - name: Set custom env vars
      shell: bash
      run: |
        echo "VCPKG_CACHE_ZIP_URL=$DEPENDENCIES_BASE_URL/installed_x86-windows-static-vs2022.zip" >> $GITHUB_ENV
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Install premake
      shell: bash
      run: ./travis/install-premake5.sh
    - name: Install dependencies
      shell: bash
      run: ./travis/dependencies.sh
    - name: Build
      shell: bash
      run: ./travis/build.sh
    - name: Predeploy
      shell: bash
      run: ./travis/predeploy.sh
    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EDOPro-Windows-ModoAventura
        path: deploy/
